name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # a half-finished publish is worse than a queued one

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A token from the release app, so the release PR and tags trigger CI.
      - name: Mint the release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Test and package the exact commit release-please tagged. No OIDC token here.
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Check the tag and the crate version match the release commit
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
          REPO: ${{ github.repository }}
        run: ./scripts/verify-release-tag.sh
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo test --all-features
      - run: cargo package --locked

  # Publish the commit that verify checked out. This job only authenticates and publishes.
  publish:
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC exchange for crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      # Cheap TOCTOU check: the tag must still point at the verified commit.
      - name: Check the tag still points at the verified commit
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
          REPO: ${{ github.repository }}
        run: ./scripts/verify-release-tag.sh
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # The first release (0.1.0) is published by hand, so skip when crates.io has this version.
      - name: Check whether this version is already on crates.io
        id: exists
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'frontmatter-spans-release (https://github.com/srobroek/frontmatter-spans)' \
            "https://crates.io/api/v1/crates/frontmatter-spans/${version}")
          case "$code" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "Version ${version} is already on crates.io; skipping publish." ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected HTTP ${code} from crates.io"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.exists.outputs.published == 'false'
      - name: Publish to crates.io
        if: steps.exists.outputs.published == 'false'
        run: cargo publish --locked --no-verify # verify already tested and packaged this commit
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
