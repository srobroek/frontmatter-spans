publish = true

[dependencies]
saphyr.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
