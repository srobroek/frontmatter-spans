[package]
name = "frontmatter-spans"
description = "Detect YAML, TOML and JSON front matter and parse it with a source span on every key and value."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["frontmatter", "front-matter", "yaml", "toml", "span"]
categories = ["parser-implementations", "text-processing"]
